version = 1

# Licensing of the files that do not carry their own
# SPDX-License-Identifier line, in the REUSE format (https://reuse.software).
# Every first-party source carries the line itself; `reuse lint` (an L0 check,
# ADR-0018) fails on a new source that has neither the line nor an entry here.
# The submodules under external/ keep their own notices and are not checked.
# Files stay without per-file copyright lines: the copyright of first-party
# files is recorded here once.

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "Vehkernel contributors"

# Documentation, data and configuration files.
[[annotations]]
path = [
    "**/*.md",
    "**/*.json",
    "**/.gitkeep",
    ".clang-tidy",
    ".dockerignore",
    ".editorconfig",
    ".gitattributes",
    ".gitignore",
    ".gitmodules",
    ".python-version",
    "uv.lock",
    "bootloader/UPSTREAM",
]
SPDX-FileCopyrightText = "Vehkernel contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Test inputs and expected outputs compared byte for byte or by line number:
# a header line would change the golden files or shift the diagnostics.
[[annotations]]
path = [
    "test/unit/golden/**",
    "test/cmake/bad_overlay.config",
    "tools/generators/tests/**",
]
SPDX-FileCopyrightText = "Vehkernel contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Generated from the schema and kept in the tree for the Link tools; the
# schema generator tests compare it byte for byte with the generator output.
[[annotations]]
path = "tools/link/vklink/enums.py"
SPDX-FileCopyrightText = "Vehkernel contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Copied unchanged below its header from ArduPilot (GPL-3.0-or-later).
[[annotations]]
path = "tools/generators/vkboard/board_types.txt"
SPDX-FileCopyrightText = "ArduPilot Development Team"
SPDX-License-Identifier = "GPL-3.0-or-later"

# PX4's firmware uploader keeps its own BSD-3-Clause notice.
[[annotations]]
path = "tools/bootloader/external/uploader.py"
precedence = "aggregate"
SPDX-FileCopyrightText = "2012-2017 PX4 Development Team"
SPDX-License-Identifier = "BSD-3-Clause"
