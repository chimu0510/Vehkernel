# C50C V1.1 board definition (ADR-0010, ADR-0011).
#
# Only the revision-ID pins confirmed by ADR-0010 are declared so far; the
# complete definition, checked line by line against the schematic, follows
# in a later ticket.
name = "c50c-v1_1"
mcu = "stm32f407vet6"

pins = [
  { pin = "PE2",  role = "REV_ID0", func = "GPIO_INPUT" },
  { pin = "PE3",  role = "REV_ID1", func = "GPIO_INPUT" },
  { pin = "PC13", role = "REV_ID2", func = "GPIO_INPUT" },
]

# ADR-0020: S0 boot stub, S1-S2 parameters, S3 event log, S4-S7 firmware.
flash = [
  { region = "BOOT",     start = 0x08000000, size = "16K" },
  { region = "PARAMS",   start = 0x08004000, size = "32K" },
  { region = "EVENTLOG", start = 0x0800C000, size = "16K" },
  { region = "FIRMWARE", start = 0x08010000, size = "448K" },
]
