# Host-side tools for building and checking Vehkernel. Versions are exact and
# resolved through uv.lock (ADR-0016).
[project]
name = "vehkernel-tools"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "clang-tidy==21.1.6",
    "cmake==3.31.6",
    "ninja==1.13.0",
    "pytest==8.4.2",
]

[tool.uv]
package = false
