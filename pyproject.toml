# Host-side tools for building and checking Vehkernel. Versions are exact and
# resolved through uv.lock (ADR-0016).
[project]
name = "vehkernel-tools"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "clang-tidy==21.1.6",
    "cmake==3.31.6",
    "kconfiglib==14.1.0",
    "ninja==1.13.0",
    "pyserial==3.5",
    "pytest==8.4.2",
    "reuse[charset-normalizer]==6.2.0",
]

[tool.uv]
package = false
