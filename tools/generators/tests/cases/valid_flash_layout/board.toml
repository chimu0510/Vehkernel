# ADR-0020-style layout on the test SoC: stub, parameters, event log, firmware.
name = "demo"
soc = "testsoc"
board_id = 9
bootloader = { kind = "ARDUPILOT" }

pins = [
  { pin = "PA1", role = "STATUS_LED", func = "GPIO_OUTPUT" },
]

flash = [
  { region = "BOOT",     start = 0x08000000, size = "16K" },
  { region = "PARAMS",   start = 0x08004000, size = "32K" },
  { region = "EVENTLOG", start = 0x0800C000, size = 16384 },
  { region = "FIRMWARE", start = 0x08010000, size = "64K" },
]
