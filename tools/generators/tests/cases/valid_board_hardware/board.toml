# Ports, board devices on each bus type, storage, clock, timing and defaults.
name = "demo"
mcu = "testmcu"

pins = [
  { pin = "PA9",  role = "SERIAL1_TX", func = "USART1_TX" },
  { pin = "PA10", role = "SERIAL1_RX", func = "USART1_RX" },
  { pin = "PA2",  role = "SERIAL2_TX", func = "USART2_TX" },
  { pin = "PB6",  role = "I2C1_SCL",   func = "I2C1_SCL" },
  { pin = "PB7",  role = "I2C1_SDA",   func = "I2C1_SDA" },
  { pin = "PA1",  role = "IMU_SCL",    func = "GPIO_OUTPUT" },
  { pin = "PD13", role = "IMU_SDA",    func = "GPIO_OUTPUT" },
  { pin = "PA5",  role = "FLASH_SCK",  func = "SPI1_SCK" },
  { pin = "PA6",  role = "FLASH_MISO", func = "SPI1_MISO" },
  { pin = "PA7",  role = "FLASH_MOSI", func = "SPI1_MOSI" },
  { pin = "PA0",  role = "FLASH_CS",   func = "GPIO_OUTPUT" },
]

serial = [
  { port = "SERIAL1", tx = "SERIAL1_TX", rx = "SERIAL1_RX", function = "LINK" },
  { port = "SERIAL2", tx = "SERIAL2_TX", function = "LOG" },
]

devices = [
  { device = "IMU0",   kind = "IMU",   type = "ICM20948", bus = "SOFT_I2C", pins = ["IMU_SCL", "IMU_SDA"], address = 0x68, rotation = "YAW_90" },
  { device = "BARO0",  kind = "BARO",  type = "BMP280",   bus = "I2C",      pins = ["I2C1_SCL", "I2C1_SDA"], address = 0x76 },
  { device = "FLASH0", kind = "FLASH", type = "W25Q128",  bus = "SPI",      pins = ["FLASH_SCK", "FLASH_MISO", "FLASH_MOSI", "FLASH_CS"] },
]

storage = [
  { storage = "SPI_NOR_FLASH", bus = "SPI" },
]

clock = { hse_hz = 8000000, sysclk_hz = 168000000 }
timing = { trigger = "TIMER", base_rate_hz = 200, sampling = "PER_SAMPLE", dividers = { estimator = 1, velocity = 4 } }
defaults = { BATT_CAPACITY = 5000, RC_DEADZONE = 0.05 }
