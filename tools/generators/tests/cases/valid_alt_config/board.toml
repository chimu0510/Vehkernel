# PB7 is encoder input normally; alt config 1 turns it into a servo output on
# the same timer channel, and alt config 2 moves the serial TX to PB6.
name = "demo"
mcu = "testmcu"

pins = [
  { pin = "PB7", role = "ENC_B_B", func = "TIM4_CH2", alt = [{ config = 1, role = "SERVO_1", func = "TIM4_CH2" }] },
  { pin = "PA9", role = "SERIAL1_TX", func = "USART1_TX", alt = [{ config = 2, role = "STATUS_LED", func = "GPIO_OUTPUT" }] },
  { pin = "PB6", role = "ENC_B_A", func = "TIM4_CH1", alt = [{ config = 2, role = "SERIAL1_TX", func = "USART1_TX" }] },
]
