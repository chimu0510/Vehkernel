# Board IDs 110 to 119 are reserved for a vendor in ArduPilot's list.
name = "demo"
mcu = "testmcu"
board_id = 115
bootloader = { kind = "VEHKERNEL", ports = ["SERIAL1"] }

pins = [
  { pin = "PA9",  role = "SERIAL1_TX", func = "USART1_TX" },
  { pin = "PA10", role = "SERIAL1_RX", func = "USART1_RX" },
]

serial = [
  { port = "SERIAL1", tx = "SERIAL1_TX", rx = "SERIAL1_RX", function = "LINK" },
]
